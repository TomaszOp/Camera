; ESP32-CAM AI Thinker (OV2640, 4 MB PSRAM) - live camera preview over the web
; pioarduino = Arduino core 3.x on ESP-IDF 5.x

[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
; Telnet server (TELNET_SERVER_ON in lib/EspCamWeb/src/EspCamFeatures.h) - the Arduino core has no Telnet library
lib_deps =
    lennarthennigs/ESP Telnet@^2.3.0
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
