; ESP32-CAM AI Thinker (OV2640, 4 MB PSRAM) - podgląd kamery na żywo przez WWW
; pioarduino = Arduino core 3.x na ESP-IDF 5.x

[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
; serwer Telnet (TELNET_SERVER_ON w include/config.h) - core Arduino nie ma biblioteki telnet
lib_deps =
    lennarthennigs/ESP Telnet@^2.3.0
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    ; biblioteki w lib/ nie widzą include/ projektu - bez tego nie przeczytają config.h
    -Iinclude
