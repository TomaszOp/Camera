; ESP32-CAM AI Thinker (OV2640, 4 MB PSRAM) - live camera preview over the web
; pioarduino = Arduino core 3.x on ESP-IDF 5.x

[platformio]
default_envs = esp32cam   ; plain "pio run -t upload" = USB/serial

; USB/serial upload (first upload, and always after changing the partition table)
[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; two app slots of 1.875 MB each for OTA (NVS stays at 0x9000, so saved settings survive)
board_build.partitions = min_spiffs.csv
; Telnet server (TELNET_SERVER_ON in lib/EspCamWeb/src/EspCamFeatures.h) - the Arduino core has no Telnet library
lib_deps =
    lennarthennigs/ESP Telnet@^2.3.0
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1

; Upload over WiFi (OTA): pio run -e esp32cam_ota -t upload
; --auth must match OTA_PASSWORD in lib/EspCamWeb/src/EspCamFeatures.h (change both!)
; upload_port: mDNS name, or the IP address if .local does not resolve on your PC
[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = esp32cam.local
upload_flags =
    --port=3232
    --auth=esp32cam-ota
